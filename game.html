<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CryptoKids Academy: Card Game</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }
    .card {
      width: 100px;
      height: 100px;
      background-color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.3s;
    }
    .card.flipped {
      background-color: #ffeb3b;
      transform: rotateY(180deg);
    }
    .card.matched {
      background-color: #d3d3d3;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Little Traders: Match the Cards!</h1>
  <p>Your Coins: <span id="balance">0.5</span></p>
  <div class="game-container" id="gameBoard">
    <!-- Cards added by JavaScript -->
  </div>
  <p><a href="index.html">Back to Pet</a></p>
  <script src="script.js"></script>
  <script>
    // Initialize wallet (loaded from script.js)
    if (!window.wallet) {
      window.wallet = { coins: 0.5 };
    }
    // Card game logic
    const cards = [
      { id: 1, value: 'Coin', matched: false },
      { id: 2, value: 'Coin', matched: false },
      { id: 3, value: 'Wallet', matched: false },
      { id: 4, value: 'Wallet', matched: false },
      { id: 5, value: 'Send', matched: false },
      { id: 6, value: 'Send', matched: false }
    ];
    let flippedCards = [];
    let matchesFound = 0;
    // Shuffle cards
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }
    shuffle(cards);
    // Create game board
    const gameBoard = document.getElementById('gameBoard');
    cards.forEach(card => {
      const cardElement = document.createElement('div');
      cardElement.classList.add('card');
      cardElement.dataset.value = card.value;
      cardElement.dataset.id = card.id;
      cardElement.addEventListener('click', () => flipCard(cardElement, card));
      gameBoard.appendChild(cardElement);
    });
    // Flip card logic
    function flipCard(cardElement, card) {
      if (flippedCards.length < 2 && !card.matched && !flippedCards.includes(cardElement)) {
        cardElement.classList.add('flipped');
        cardElement.textContent = card.value;
        flippedCards.push(cardElement);
        if (flippedCards.length === 2) {
          setTimeout(checkMatch, 1000);
        }
      }
    }
    // Check for match
    function checkMatch() {
      const [card1, card2] = flippedCards;
      if (card1.dataset.value === card2.dataset.value) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        cards.find(c => c.id == card1.dataset.id).matched = true;
        cards.find(c => c.id == card2.dataset.id).matched = true;
        matchesFound++;
        if (matchesFound === 3) {
          window.wallet.coins += 0.05;
          document.getElementById('balance').innerText = window.wallet.coins.toFixed(2);
          alert('You won! Earned 0.05 coins!');
        }
      } else {
        card1.classList.remove('flipped');
        card2.classList.remove('flipped');
        card1.textContent = '';
        card2.textContent = '';
      }
      flippedCards = [];
    }
    // Update balance display
    document.getElementById('balance').innerText = window.wallet.coins.toFixed(2);
  </script>
</body>
</html>
