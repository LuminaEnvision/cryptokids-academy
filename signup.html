<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CryptoKids Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Join the Dragon’s Treasure Quest!</h1>
  <div class="logo-placeholder">🐉 CKA</div>
  <p id="story">Parents, create your kid’s crypto adventure! Enter details to get a secret dragon key.</p>
  <div class="signup-form">
    <input type="email" id="parent-email" placeholder="Parent Email (optional)" style="display: block; margin: 10px auto;">
    <select id="child-age" style="display: block; margin: 10px auto;">
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
    </select>
    <input type="text" id="child-nickname" placeholder="Child Nickname" style="display: block; margin: 10px auto;">
    <button onclick="signUp()">Create Account</button>
  </div>
  <p><a href="child-login.html" class="signup-link">Back to Log In</a></p>
  <footer>2025 CC Academy</footer>
  <script src="script.js"></script>
</body>
</html>
